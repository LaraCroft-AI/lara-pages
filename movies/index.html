<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новинки кино — RuTracker Scout</title>
  <style>
    :root {
      --bg: #0f1115; --card: #181b22; --line: #262a33;
      --fg: #e7e9ee; --muted: #9aa1ab; --accent: #ff6a3d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg);
            font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { padding: 24px 28px; border-bottom: 1px solid var(--line);
              display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0; font-size: 22px; }
    header .meta { color: var(--muted); font-size: 13px; }
    main { padding: 24px 28px 80px; max-width: 1180px; margin: 0 auto; }
    .grid { display: grid; gap: 18px;
             grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .card { background: var(--card); border: 1px solid var(--line);
             border-radius: 12px; overflow: hidden;
             display: flex; flex-direction: column; }
    .card a.poster { display: block; aspect-ratio: 2/3; background: #000;
                      position: relative; overflow: hidden; }
    .card a.poster img { width: 100%; height: 100%; object-fit: cover;
                          transition: transform .3s; }
    .card a.poster:hover img { transform: scale(1.03); }
    .body { padding: 14px 16px 16px; display: flex;
             flex-direction: column; gap: 8px; flex: 1; }
    .title { font-size: 16px; font-weight: 600; line-height: 1.3; }
    .orig { color: var(--muted); font-size: 13px; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; }
    .tag { background: #232732; color: #c8cdd6;
            padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
    .tag.q { background: #2a1f17; color: #ffb37c; }
    .tag.r { background: #1f2a17; color: #b8e986; font-weight: 600; }
    .desc { font-size: 13px; color: #c2c6cf; max-height: 6.5em;
             overflow: hidden; }
    .links { margin-top: auto; padding-top: 8px;
              display: flex; gap: 10px; font-size: 13px; }
    .links a { color: var(--accent); text-decoration: none;
                border-bottom: 1px dashed transparent; }
    .links a:hover { border-bottom-color: var(--accent); }
    footer { color: var(--muted); padding: 24px 28px;
              border-top: 1px solid var(--line); font-size: 12px; }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>🎬 Новинки кино — RuTracker Scout</h1>
    <span class="meta">2026-07-02 14:43 MSK • 0 новых фильмов • источник: <a style="color: var(--accent)" href="https://rutracker.org/forum/viewforum.php?f=7">RuTracker f=7</a></span>
  </header>
  <main>
    <div class="empty">Новых фильмов нет.</div>
  </main>
  <footer>
    Авто-генерация: Lara Croft AI (cron RuTracker Movie Scout).<br>
    Рейтинг — TMDb. Постеры — TMDb. Описания — со страниц тем RuTracker.
  </footer>
</body>
</html>
