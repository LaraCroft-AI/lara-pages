<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Китайский язык — Галерея</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        header {
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        /* Global Dictionary Selector */
        .global-selector {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 30px;
            gap: 10px;
        }
        .dict-label {
            font-weight: bold;
            font-size: 1.1em;
        }
        #dictSelect {
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid #2575fc;
            font-size: 16px;
            outline: none;
            cursor: pointer;
            background: white;
            min-width: 200px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: #eee;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: #2575fc;
            color: white;
            box-shadow: 0 4px 10px rgba(37, 117, 252, 0.3);
        }

        /* Section Visibility */
        .page-section {
            display: none;
        }
        .page-section.active {
            display: block;
        }

        /* Gallery Styles */
        .search-box {
            margin: 20px 0;
            text-align: center;
        }
        #searchInput {
            padding: 12px 20px;
            width: 80%;
            max-width: 500px;
            border: 2px solid #2575fc;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }
        #searchInput:focus {
            width: 85%;
            box-shadow: 0 0 15px rgba(37, 117, 252, 0.3);
        }
        .vocab-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .word-card {
            background: #f8f9fa;
            border-left: 5px solid #2575fc;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .word-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .chinese {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        .pinyin {
            font-size: 1.2em;
            color: #2575fc;
            margin-bottom: 10px;
            text-align: center;
        }
        .russian {
            font-size: 1em;
            color: #555;
            text-align: center;
        }

        /* Flashcard Styles */
        .training-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 600px;
            margin: 0 auto;
        }
        .flashcard {
            width: 100%;
            min-height: 250px;
            background: #fdfdfd;
            border: 3px solid #2575fc;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .flashcard-word {
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }
        .option-btn {
            padding: 15px;
            font-size: 1.3em;
            border: 2px solid #ddd;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .option-btn:hover {
            border-color: #2575fc;
            background: #f0f7ff;
        }
        .option-btn.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .option-btn.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        .option-btn .opt-pinyin {
            font-size: 0.7em;
            color: #666;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: #777;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            .vocab-list {
                grid-template-columns: 1fr;
            }
            #searchInput {
                width: 90%;
            }
        }
    </style>
</head>

        <div class="nav-tabs">

            <button class="tab-btn" onclick="switchTab('training')">🎯 Тренировка</button>
        </div>

        <!-- Section 1: Gallery -->
        <div id="gallery" class="page-section active">
            <div class="search-box">

            <div class="vocab-list" id="vocabList"></div>

        <!-- Section 2: Training -->

        </div>

                {"chinese": "鸭子", "pinyin": "yā zi", "russian": "Утка", "notes": ""},
                {"chinese": "鱼缸", "pinyin": "yú gāng", "russian": "аквариум", "notes": ""},
                {"chinese": "鸟", "pinyin": "niǎo", "russian": "птица", "notes": ""},
                {"chinese": "鳄鱼", "pinyin": "è yú", "russian": "Крокодил", "notes": ""},
                {"chinese": "恶心", "pinyin": "ě xin", "russian": "тошнота", "notes": ""},
                {"chinese": "鵝", "pinyin": "é", "russian": "Гусь", "notes": ""},
                {"chinese": "阿胶", "pinyin": "ē jiāo", "russian": "лекарство из ослиной шкуры", "notes": ""}
            ]
        }

        let currentVocab = dictionaries['Duolingo'];

        function onDictChange() {
            const selected = document.getElementById('dictSelect').value;
            currentVocab = dictionaries[selected];
            
            if (document.getElementById('gallery').classList.contains('active')) {
                searchVocabulary();
            } else {
                nextQuestion();
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');

            if (tabId === 'training') {
                startTraining();
            }
        }

        function searchVocabulary() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('vocabList');
            list.innerHTML = '';

            const filtered = currentVocab.filter(item =>
                item.chinese.toLowerCase().includes(input) ||
                item.pinyin.toLowerCase().includes(input) ||
                item.russian.toLowerCase().includes(input)
            );

            if (filtered.length === 0) {
                list.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: #888;">Ничего не найдено.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="chinese">${item.chinese}</div>
                    <div class="pinyin">${item.pinyin}</div>
                    <div class="russian">${item.russian}</div>
                `;
                list.appendChild(card);
            });
        }

        // Training Logic
        let currentQuestion = null;

        function startTraining() {
            nextQuestion();
        }

        function nextQuestion() {
            const feedback = document.getElementById('feedback');
            feedback.innerText = '';
            
            if (!currentVocab || currentVocab.length === 0) {
                document.getElementById('questionWord').innerText = "Словарь пуст";
                return;
            }

            currentQuestion = currentVocab[Math.floor(Math.random() * currentVocab.length)];
            document.getElementById('questionWord').innerText = currentQuestion.russian;

            let options = [currentQuestion];
            while (options.length < 3 && currentVocab.length > options.length) {
                let randomWord = currentVocab[Math.floor(Math.random() * currentVocab.length)];
                if (!options.find(o => o.chinese === randomWord.chinese)) {
                    options.push(randomWord);
                }
            }
            
            options.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `
                    <span class="opt-chinese">${opt.chinese}</span>
                    <span class="opt-pinyin">${opt.pinyin}</span>
                `;
                btn.onclick = () => checkAnswer(btn, opt);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(btn, selectedOpt) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selectedOpt.chinese === currentQuestion.chinese) {
                btn.classList.add('correct');
                document.getElementById('feedback').innerText = '✅ Правильно!';
                document.getElementById('feedback').style.color = 'green';
            } else {
                btn.classList.add('wrong');
                document.getElementById('feedback').innerText = '❌ Ошибка!';
                document.getElementById('feedback').style.color = 'red';
                
                allBtns.forEach(b => {
                    if (b.querySelector('.opt-chinese').innerText === currentQuestion.chinese) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(nextQuestion, 2000);
        }

        document.getElementById('searchInput').addEventListener('input', searchVocabulary);

        window.onload = () => {
            searchVocabulary();
        };
    </script>
</body>
</html>
