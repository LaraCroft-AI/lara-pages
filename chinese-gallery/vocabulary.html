<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Китайский язык — Галерея</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .page-section { display: none; }
        .page-section.active { display: block; }
        .option-btn.correct { background-color: #d1fae5; border-color: #10b981; color: #065f46; }
        .option-btn.wrong { background-color: #fee2e2; border-color: #ef4444; color: #991b1b; }
        .dict-chip.active { background-color: #3b82f6; color: white; border-color: #2563eb; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-slate-200 min-h-screen p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="bg-gradient-to-r from-indigo-600 to-blue-500 text-white rounded-3xl p-8 text-center shadow-xl mb-8 relative overflow-hidden">
            <div class="relative z-10">
                <h1 class="text-4xl md:text-5xl font-bold mb-2">Китайский язык</h1>
                <p class="text-indigo-100 text-lg">Персональный интерактивный словарь</p>
            </div>
            <div class="absolute top-[-20px] right-[-20px] w-32 h-32 bg-white opacity-10 rounded-full"></div>
            <div class="absolute bottom-[-20px] left-[-20px] w-24 h-24 bg-white opacity-10 rounded-full"></div>
        </header>

        <!-- Controls Area -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-6 mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex flex-col gap-3 w-full md:w-auto">
                <span class="text-slate-500 font-medium">Выберите словари:</span>
                <div id="dictChips" class="flex flex-wrap gap-2">
                    <!-- Chips generated by JS -->
                </div>
            </div>

            <div class="flex p-1 bg-slate-100 rounded-full w-full md:w-auto">
                <button onclick="switchTab('gallery')" id="btn-gallery" class="tab-btn flex-1 md:flex-none px-6 py-2 rounded-full text-sm font-semibold transition-all duration-200 active-tab bg-white text-blue-600 shadow-sm">
                    📚 Словарь
                </button>
                <button onclick="switchTab('training')" id="btn-training" class="tab-btn flex-1 md:flex-none px-6 py-2 rounded-full text-sm font-semibold transition-all duration-200 text-slate-500 hover:text-slate-700">
                    🎯 Тренировка
                </button>
            </div>
        </div>

        <!-- Section 1: Gallery -->
        <div id="gallery" class="page-section active">
            <div class="flex justify-center mb-8">
                <div class="relative w-full max-w-md">
                    <input type="text" id="searchInput" placeholder="Поиск иероглифов, пиньинь или перевода..." 
                           class="w-full px-6 py-3 rounded-full border-2 border-blue-400 focus:ring-4 focus:ring-blue-200 outline-none transition-all shadow-sm text-lg">
                    <span class="absolute right-4 top-3 text-slate-400">🔍</span>
                </div>
            </div>
            <div class="vocab-list grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="vocabList">
                <!-- Cards generated by JS -->
            </div>
        </div>

        <!-- Section 2: Training -->
        <div id="training" class="page-section">
            <div class="max-w-2xl mx-auto flex flex-col items-center">
                <div class="w-full mb-4 flex justify-between items-center px-4">
                    <span id="progressText" class="text-slate-500 font-medium text-sm">Осталось слов: 0 / 0</span>
                    <div class="w-32 h-2 bg-slate-200 rounded-full overflow-hidden">
                        <div id="progressBar" class="h-full bg-blue-500 transition-all duration-300" style="width: 0%"></div>
                    </div>
                </div>

                <div class="w-full bg-white border-4 border-blue-500 rounded-3xl p-12 text-center shadow-2xl mb-8 min-h-[300px] flex flex-col justify-center items-center transition-all">
                    <div id="questionWord" class="text-4xl md:text-5xl font-bold text-slate-800 mb-6">Загрузка...</div>
                    <div id="feedback" class="text-xl font-bold h-8 transition-all duration-300"></div>
                </div>
                
                <div class="grid grid-cols-1 gap-4 w-full" id="optionsGrid">
                    <!-- Options generated by JS -->
                </div>
            </div>
        </div>

        <footer class="text-center mt-12 pb-8 text-slate-400 text-sm">
            <p>Создано с ❤️ для Максима | Обновлено: 29 июня 2026</p>
        </footer>
    </div>

    <script>
        let allDictionaries = {};
        let activeDictNames = [];
        let currentVocab = [];
        let trainingPool = [];

        async function init() {
            try {
                const response = await fetch('vocab_data.json');
                allDictionaries = await response.json();
                
                const chipsContainer = document.getElementById('dictChips');
                chipsContainer.innerHTML = '';
                
                Object.keys(allDictionaries).forEach((name, index) => {
                    const chip = document.createElement('button');
                    chip.className = 'dict-chip px-4 py-1.5 rounded-full border-2 border-slate-200 text-slate-600 text-xs font-semibold transition-all hover:border-blue-300 cursor-pointer';
                    chip.innerText = name;
                    chip.onclick = () => toggleDict(name, chip);
                    if (index === 0) {
                        chip.classList.add('active');
                        activeDictNames.push(name);
                    }
                    chipsContainer.appendChild(chip);
                });

                updateCurrentVocab();
            } catch (error) {
                console.error("Ошибка загрузки словарей:", error);
                document.getElementById('vocabList').innerHTML = '<p class="col-span-full text-center text-red-500 py-10">Ошибка загрузки файла данных.</p>';
            }
        }

        function toggleDict(name, element) {
            if (activeDictNames.includes(name)) {
                activeDictNames = activeDictNames.filter(n => n !== name);
                element.classList.remove('active');
            } else {
                activeDictNames.push(name);
                element.classList.add('active');
            }
            updateCurrentVocab();
        }

        function updateCurrentVocab() {
            currentVocab = [];
            activeDictNames.forEach(name => {
                if (allDictionaries[name]) {
                    currentVocab = [...currentVocab, ...allDictionaries[name]];
                }
            });
            
            if (document.getElementById('gallery').classList.contains('active')) {
                searchVocabulary();
            } else if (document.getElementById('training').classList.contains('active')) {
                startTraining();
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
                b.classList.add('text-slate-500', 'hover:text-slate-700');
            });
            
            document.getElementById(tabId).classList.add('active');
            const activeBtn = document.getElementById('btn-' + tabId);
            activeBtn.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
            activeBtn.classList.remove('text-slate-500', 'hover:text-slate-700');

            if (tabId === 'gallery') {
                searchVocabulary();
            } else if (tabId === 'training') {
                startTraining();
            }
        }

        function searchVocabulary() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const list = document.getElementById('vocabList');
            list.innerHTML = '';

            // PRIMARY CHECK: Are any dictionaries selected?
            if (activeDictNames.length === 0) {
                list.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10">Пожалуйста, выберите один или несколько словарей выше.</p>';
                return;
            }

            if (!currentVocab || currentVocab.length === 0) {
                list.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10">В выбранных словарях нет слов.</p>';
                return;
            }

            const filtered = currentVocab.filter(item =>
                item.word.toLowerCase().includes(input) ||
                item.pinyin.toLowerCase().includes(input) ||
                item.meaning.toLowerCase().includes(input)
            );

            if (filtered.length === 0) {
                list.innerHTML = '<p class="col-span-full text-center text-slate-400 py-10">Ничего не найдено.</p>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white p-6 rounded-2xl border-l-4 border-blue-500 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all cursor-default';
                card.innerHTML = `
                    <div class="text-3xl font-bold text-center mb-2 text-slate-800">${item.word}</div>
                    <div class="text-blue-500 text-center font-semibold mb-2 text-xl">${item.pinyin}</div>
                    <div class="text-slate-600 text-center text-sm">${item.meaning}</div>
                `;
                list.appendChild(card);
            });
        }

        let currentQuestion = null;
        let totalWordsAtStart = 0;

        function startTraining() {
            trainingPool = [...currentVocab];
            totalWordsAtStart = trainingPool.length;
            nextQuestion();
        }

        function nextQuestion() {
            const feedback = document.getElementById('feedback');
            feedback.innerText = '';
            
            if (!trainingPool || trainingPool.length === 0) {
                if (totalWordsAtStart === 0) {
                    document.getElementById('questionWord').innerText = "Словарь пуст";
                } else {
                    document.getElementById('questionWord').innerText = "🎉 Все слова выучены!";
                }
                document.getElementById('optionsGrid').innerHTML = '';
                updateProgress();
                return;
            }

            updateProgress();

            currentQuestion = trainingPool[Math.floor(Math.random() * trainingPool.length)];
            document.getElementById('questionWord').innerText = currentQuestion.meaning;

            let options = [currentQuestion];
            while (options.length < 3 && currentVocab.length > options.length) {
                let randomWord = currentVocab[Math.floor(Math.random() * currentVocab.length)];
                if (!options.find(o => o.word === randomWord.word)) {
                    options.push(randomWord);
                }
            }
            
            options.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full p-4 text-xl border-2 border-slate-200 rounded-xl bg-white hover:border-blue-400 hover:bg-blue-50 transition-all flex flex-col items-center';
                btn.innerHTML = `
                    <span class="font-bold text-slate-800">${opt.word}</span>
                    <span class="text-lg text-slate-500 font-medium">${opt.pinyin}</span>
                `;
                btn.onclick = () => checkAnswer(btn, opt);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(btn, selectedOpt) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selectedOpt.word === currentQuestion.word) {
                btn.classList.add('correct');
                document.getElementById('feedback').innerText = '✅ Правильно!';
                document.getElementById('feedback').style.color = '#059669';
                trainingPool = trainingPool.filter(item => item.word !== currentQuestion.word);
            } else {
                btn.classList.add('wrong');
                document.getElementById('feedback').innerText = '❌ Ошибка!';
                document.getElementById('feedback').style.color = '#dc2626';
                allBtns.forEach(b => {
                    if (b.querySelector('.font-bold').innerText === currentQuestion.word) {
                        b.classList.add('correct');
                    }
                });
            }

            setTimeout(nextQuestion, 2000);
        }

        function updateProgress() {
            const remaining = trainingPool.length;
            document.getElementById('progressText').innerText = `Осталось слов: ${remaining} / ${totalWordsAtStart}`;
            const percent = totalWordsAtStart === 0 ? 0 : ( (totalWordsAtStart - remaining) / totalWordsAtStart ) * 100;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        document.getElementById('searchInput').addEventListener('input', searchVocabulary);

        window.onload = init;
    </script>
</body>
</html>
