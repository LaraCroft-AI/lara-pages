<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LaraCroft-AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: #0d1117; color: #c9d1d9;
    }
    .container { text-align: center; }
    h1 { font-size: 2.5rem; color: #58a6ff; margin-bottom: 0.5rem; }
    p { font-size: 1.1rem; opacity: 0.7; }
    .status { margin-top: 2rem; padding: 0.5rem 1.5rem;
      border: 1px solid #238636; border-radius: 8px; color: #3fb950;
      display: inline-block; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ LaraCroft-AI</h1>
    <p>GitHub Pages is live.</p>
    <div class="status">● All systems operational</div>
  </div>
</body>
</html>
